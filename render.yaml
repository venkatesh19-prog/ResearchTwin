services:
  - type: web
    name: researchtwin-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt -c constraints.txt && python scripts/fetch_embedding_model.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: RATE_LIMIT_HASH_SECRET
        sync: false
      # Only enable this together with an explicit RATE_LIMIT_TRUSTED_PROXY_CIDRS
      # allowlist for the actual edge proxy; otherwise clients can spoof the header.
      - key: RATE_LIMIT_TRUST_CF_CONNECTING_IP
        value: "false"
      - key: RATE_LIMIT_TRUSTED_PROXY_CIDRS
        sync: false
      - key: RATE_LIMIT_REQUIRE_SHARED_DATABASE
        value: "true"
      - key: RATE_LIMIT_REGISTER_MAX
        value: "5"
      - key: RATE_LIMIT_REGISTER_WINDOW_SECONDS
        value: "3600"
      - key: RATE_LIMIT_LOGIN_MAX
        value: "10"
      - key: RATE_LIMIT_LOGIN_WINDOW_SECONDS
        value: "900"
      - key: RATE_LIMIT_RECOMMENDATION_MAX
        value: "8"
      - key: RATE_LIMIT_RECOMMENDATION_WINDOW_SECONDS
        value: "300"
      - key: MAX_REQUEST_BODY_BYTES
        value: "65536"
      - key: RECOMMENDATION_MAX_CONCURRENCY
        value: "2"
