services:
  - type: web
    name: researchtwin-api
    runtime: python
    rootDir: backend
    buildCommand: pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt -c constraints.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: RATE_LIMIT_HASH_SECRET
        sync: false
      - key: RATE_LIMIT_TRUST_CF_CONNECTING_IP
        value: "true"
      - key: RATE_LIMIT_REQUIRE_SHARED_DATABASE
        value: "true"
      - key: RATE_LIMIT_REGISTER_MAX
        value: "5"
      - key: RATE_LIMIT_REGISTER_WINDOW_SECONDS
        value: "3600"
      - key: RATE_LIMIT_LOGIN_MAX
        value: "10"
      - key: RATE_LIMIT_LOGIN_WINDOW_SECONDS
        value: "900"
      - key: RATE_LIMIT_RECOMMENDATION_MAX
        value: "8"
      - key: RATE_LIMIT_RECOMMENDATION_WINDOW_SECONDS
        value: "300"
      - key: MAX_REQUEST_BODY_BYTES
        value: "65536"
