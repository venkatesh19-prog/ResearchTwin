<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResearchTwin Application Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0F1117;
            --bg-card: #1A1D26;
            --primary: #D96500;
            --accent-blue: #0078D4;
            --accent-green: #28A745;
            --text-sub: #A0A5B5;
            --border: #2A2E3D;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: var(--bg-dark);
            color: white;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 240px;
            background: #141721;
            border-right: 1px solid var(--border);
            padding: 20px 0;
            display: flex;
            flex-direction: column;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 20px 25px;
            border-bottom: 1px solid var(--border);
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #FF9900, #D96500);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        .nav-menu {
            list-style: none;
            margin-top: 20px;
        }

        .nav-menu li a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 20px;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .nav-menu li a.active, .nav-menu li a:hover {
            background: rgba(217, 101, 0, 0.15);
            color: var(--primary);
            border-left: 4px solid var(--primary);
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            background: #12141D;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: white;
            margin-bottom: 15px;
            font-size: 14px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: #B55200;
        }

        .match-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .score-badge {
            background: rgba(40, 167, 69, 0.2);
            color: var(--accent-green);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 800;
            border: 1px solid var(--accent-green);
        }

        .shap-box {
            background: #12141D;
            border: 1px solid #2B3042;
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
        }

        .tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            margin: 3px;
            font-weight: bold;
        }

        .tag-match {
            background: rgba(0, 120, 212, 0.3);
            color: #70B5FF;
        }

        .tag-miss {
            background: rgba(217, 56, 30, 0.3);
            color: #FF8878;
        }
    </style>
<script src="frontend-config.js"></script>
</head>
<body>

    <div class="sidebar">
        <div class="brand">
            <div class="brand-icon"><i class="fa-solid fa-brain"></i></div>
            <div>
                <h3 style="font-size:16px;">ResearchTwin</h3>
                <span style="font-size:11px; color:var(--text-sub);">ML Matching Platform</span>
            </div>
        </div>
        <ul class="nav-menu">
            <li><a href="#" class="active" id="navMatches" onclick="switchTab('matchView')"><i class="fa-solid fa-wand-magic-sparkles"></i> ML Recommendations</a></li>
            <li><a href="#" id="navStudent" onclick="switchTab('studentView')"><i class="fa-solid fa-user-gear"></i> Student Profile</a></li>
            <li><a href="#" id="navFaculty" onclick="switchTab('facultyView')"><i class="fa-solid fa-graduation-cap"></i> Faculty Directory</a></li>
        </ul>
    </div>

    <div class="main-content">

        <!-- 1. ML RECOMMENDATIONS & EXPLAINABILITY -->
        <div id="matchView" class="view-section active">
            <div class="card">
                <div class="card-title"><i class="fa-solid fa-robot"></i> Faculty Matching & Recommendations</div>
                <p style="color:var(--text-sub); margin-bottom:15px;">Calculates student-researcher compatibility, SHAP attributions, and readiness roadmaps.</p>
                <button class="btn" onclick="fetchMatches()"><i class="fa-solid fa-rotate"></i> Run ML Match Engine</button>
            </div>
            <div id="matchesContainer"></div>
        </div>

        <!-- 2. STUDENT PROFILE -->
        <div id="studentView" class="view-section">
            <div class="card">
                <div class="card-title"><i class="fa-solid fa-id-card"></i> Student Research Profile</div>
                <form onsubmit="saveStudentProfile(event)">
                    <label style="font-size:12px; color:var(--text-sub);">Student ID</label>
                    <input type="text" id="sId" value="S001" readonly>

                    <label style="font-size:12px; color:var(--text-sub);">Research Interests</label>
                    <input type="text" id="sAreas" placeholder="e.g. Artificial Intelligence, Machine Learning">

                    <label style="font-size:12px; color:var(--text-sub);">Technical Skills</label>
                    <input type="text" id="sSkills" placeholder="e.g. Python, PyTorch, SQL">

                    <label style="font-size:12px; color:var(--text-sub);">Projects & Academic Details</label>
                    <textarea id="sProjects" rows="3" placeholder="Describe recent projects or publications"></textarea>

                    <button type="submit" class="btn"><i class="fa-solid fa-floppy-disk"></i> Update & Re-index Profile</button>
                </form>
            </div>
        </div>

        <!-- 3. FACULTY DIRECTORY & SEARCH -->
        <div id="facultyView" class="view-section">
            <div class="card">
                <div class="card-title"><i class="fa-solid fa-magnifying-glass"></i> Faculty Directory & Research Search</div>
                <input type="text" id="facSearch" placeholder="Search by research domain, topic, or required skill keyword..." onkeyup="searchFaculty()">
                <div id="facultyList"></div>
            </div>
        </div>

    </div>

    <script>

const API_BASE = (window.RESEARCHTWIN_API_BASE || "http://127.0.0.1:8000").replace(/\/$/, "");
const PROFILE_KEY = "researchtwin.studentProfile";

const $ = (id) => document.getElementById(id);

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function getStudentProfile() {
    return {
        research_areas: $("sAreas").value.trim(),
        expertise: "Machine Learning",
        skills: $("sSkills").value.trim(),
        projects: $("sProjects").value.trim(),
        publications: "",
        top_k: 5
    };
}

async function apiRequest(path, options = {}) {
    const response = await fetch(`${API_BASE}${path}`, {
        ...options,
        headers: {
            ...(options.body ? { "Content-Type": "application/json" } : {}),
            ...options.headers
        }
    });

    if (!response.ok) {
        const detail = await response.text();
        throw new Error(`API ${response.status}: ${detail}`);
    }

    return response.json();
}

function switchTab(viewId) {
    document.querySelectorAll(".view-section")
        .forEach(el => el.classList.remove("active"));

    document.querySelectorAll(".nav-menu a")
        .forEach(el => el.classList.remove("active"));

    $(viewId).classList.add("active");

    const navIds = {
        matchView: "navMatches",
        studentView: "navStudent",
        facultyView: "navFaculty"
    };

    $(navIds[viewId])?.classList.add("active");

    if (viewId === "matchView") fetchMatches();
    if (viewId === "studentView") loadStudentProfile();
    if (viewId === "facultyView") searchFaculty();
}

async function fetchMatches() {
    const container = $("matchesContainer");
    container.textContent = "Running researcher matching…";

    try {
        const profile = getStudentProfile();

        if (!profile.research_areas && !profile.skills &&
            !profile.projects && !profile.publications) {
            container.innerHTML =
                '<p style="color:#A0A5B5">Add your research interests, skills or projects in Student Profile first.</p>';
            return;
        }

        const data = await apiRequest("/recommendations/researchers", {
            method: "POST",
            body: JSON.stringify(profile)
        });

        renderMatches(data.recommendations || []);
    } catch (error) {
        container.innerHTML =
            `<p style="color:#FF8878">Could not load recommendations: ${escapeHTML(error.message)}. Check that the backend is running and CORS is configured.</p>`;
    }
}

function renderMatches(recommendations) {
    const container = $("matchesContainer");
    container.innerHTML = "";

    if (!recommendations.length) {
        container.textContent = "No researchers found. Check that researcher records are available.";
        return;
    }

    recommendations.forEach((researcher) => {
        const score = Number(researcher.match_score);
        const scoreLabel = Number.isFinite(score)
            ? `${(score * 100).toFixed(1)}% model score`
            : "Score unavailable";

        const matched = Array.isArray(researcher.matched_skills)
            ? researcher.matched_skills : [];

        const missing = Array.isArray(researcher.skill_gap)
            ? researcher.skill_gap : [];

        const explanation = researcher.explanation || {};
        const contributions = explanation.all_contributions || [];

        const matchedTags = matched.map(skill =>
            `<span class="tag tag-match">✓ ${escapeHTML(skill)}</span>`
        ).join("");

        const missingTags = missing.map(skill =>
            `<span class="tag tag-miss">＋ ${escapeHTML(skill)}</span>`
        ).join("");

        const contributionHTML = contributions.slice(0, 5).map(item => {
            const impact = Number(item.shap_value);
            const positive = impact >= 0;

            return `<div style="display:flex;justify-content:space-between;gap:12px;margin:5px 0;font-size:12px">
                <span>${escapeHTML(item.feature)}</span>
                <b style="color:${positive ? "#28A745" : "#FF4D4D"}">
                    ${positive ? "+" : ""}${Number.isFinite(impact) ? impact.toFixed(4) : "N/A"}
                </b>
            </div>`;
        }).join("");

        const card = document.createElement("div");
        card.className = "match-card";

        card.innerHTML = `
            <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px">
                <div>
                    <h3>${escapeHTML(researcher.name)}</h3>
                    <span style="font-size:13px;color:var(--text-sub)">
                        ${escapeHTML(researcher.department || "Department not specified")}
                    </span>
                </div>
                <div class="score-badge">${scoreLabel}</div>
            </div>

            <p style="font-size:14px;margin-bottom:12px">
                ${escapeHTML(explanation.summary || researcher.why_recommended || "No explanation available.")}
            </p>

            <div style="margin-bottom:10px">
                <div style="font-size:12px;color:var(--text-sub);margin-bottom:5px">
                    Shared skills
                </div>
                ${matchedTags || '<span style="color:var(--text-sub)">No shared skills identified</span>'}
            </div>

            <div style="margin-bottom:10px">
                <div style="font-size:12px;color:var(--text-sub);margin-bottom:5px">
                    Skills to develop
                </div>
                ${missingTags || '<span style="color:var(--text-sub)">No skill gaps identified</span>'}
            </div>

            <div class="shap-box">
                <div style="font-size:12px;font-weight:bold;color:var(--primary);margin-bottom:8px">
                    Model explanation — feature contributions
                </div>
                ${contributionHTML || '<span style="color:var(--text-sub)">No feature explanations returned.</span>'}
                <p style="font-size:11px;color:var(--text-sub);margin-top:8px">
                    Contributions show which input features influenced this model output.
                    They are not probabilities of successful collaboration.
                </p>
            </div>
        `;

        container.appendChild(card);
    });
}

function loadStudentProfile() {
    try {
        const saved = JSON.parse(localStorage.getItem(PROFILE_KEY) || "{}");
        $("sAreas").value = saved.research_areas || "";
        $("sSkills").value = saved.skills || "";
        $("sProjects").value = saved.projects || "";
    } catch {
        console.warn("Could not load the locally saved student profile.");
    }
}

function saveStudentProfile(event) {
    event.preventDefault();

    const profile = getStudentProfile();

    localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));

    alert("Profile saved in this browser. It has not been saved to the backend database.");
    switchTab("matchView");
}

async function searchFaculty() {
    const list = $("facultyList");
    const query = ($("facSearch").value || "").trim().toLowerCase();

    list.textContent = "Loading faculty directory…";

    try {
        const researchers = await apiRequest("/researchers/");
        const filtered = (Array.isArray(researchers) ? researchers : [])
            .filter(person => {
                const searchable = [
                    person.name,
                    person.department,
                    person.designation,
                    person.research_areas,
                    person.expertise,
                    person.skills,
                    person.publications,
                    person.projects
                ].join(" ").toLowerCase();

                return searchable.includes(query);
            });

        list.innerHTML = "";

        if (!filtered.length) {
            list.textContent = "No researchers match that search.";
            return;
        }

        filtered.forEach(person => {
            const item = document.createElement("div");
            item.style.cssText = "padding:15px 0;border-bottom:1px solid var(--border)";

            item.innerHTML = `
                <b style="color:#FFF">${escapeHTML(person.name)}</b>
                <span style="color:var(--text-sub);font-size:12px">
                    (${escapeHTML(person.department || "Department not specified")})
                </span>
                <p style="color:var(--text-sub);font-size:13px;margin-top:6px">
                    ${escapeHTML(person.research_areas || person.expertise || "Research interests not provided")}
                </p>
                <p style="color:var(--text-sub);font-size:12px;margin-top:4px">
                    Skills: ${escapeHTML(person.skills || "Not listed")}
                </p>
            `;

            list.appendChild(item);
        });
    } catch (error) {
        list.textContent = `Faculty search failed: ${error.message}. Check the backend and CORS configuration.`;
    }
}

window.addEventListener("DOMContentLoaded", () => {
    loadStudentProfile();
    fetchMatches();
});

    </script>
</body>
</html>
